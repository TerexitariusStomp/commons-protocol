name: ci
on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JS deps
        run: npm ci
      - name: License gate
        run: node scripts/check-licenses.mjs
      - name: Custom LOC budget (<5%)
        run: bash scripts/custom-loc-budget.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build + test
        run: cd contracts && forge build && forge test -vvv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build -w apps/web
